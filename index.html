<!DOCTYPE html>
<html>
<head>
    <title>Click Me 😏</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
            font-family: Arial;
            color: white;
            text-align: center;
        }

        button {
            padding: 20px 40px;
            font-size: 24px;
            background-color: #00ffcc;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        #text {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div>
    <button onclick="rickroll()">Click Me</button>

    <div id="text">
        <h2>
            never gonna give you up, never gonna let you down,<br>
            never gonna run around and desert you.
        </h2>
    </div>
</div>

<script>
function rickroll() {
    document.getElementById("text").style.display = "block";

    window.open(
        "https://www.youtube.com/watch?v=dQw4w9WgXcQ&autoplay=1",
        "_blank",
        "width=800,height=600"
    );
}
</script>

</body>
</html>
